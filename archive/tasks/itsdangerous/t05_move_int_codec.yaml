id: itsdangerous-t05-move-int-codec
kind: move_function
reference: t05_move_int_codec.diff
instruction: >-
  Move the functions `int_to_bytes` and `bytes_to_int` (and the private struct helpers they depend on) out of src/itsdangerous/encoding.py into a new module src/itsdangerous/_int_codec.py. Remove them from encoding.py and update every import of them across the codebase, including tests. Do not re-export them from encoding.py.
touched: [src/itsdangerous/encoding.py, src/itsdangerous/timed.py, tests/test_itsdangerous/test_encoding.py]
absent: ['from (itsdangerous|\.)\.?encoding import (int_to_bytes|bytes_to_int)']
check: "import itsdangerous.encoding as e; from itsdangerous._int_codec import int_to_bytes, bytes_to_int; assert bytes_to_int(int_to_bytes(300)) == 300; assert not hasattr(e, 'int_to_bytes') and not hasattr(e, 'bytes_to_int')"
