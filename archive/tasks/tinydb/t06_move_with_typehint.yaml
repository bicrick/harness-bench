id: tinydb-t06-move-with-typehint
kind: move_function
reference: t06_move_with_typehint.diff
instruction: >-
  Move the function `with_typehint` out of tinydb/utils.py into a new module tinydb/typing_utils.py. Remove it from tinydb/utils.py (including its __all__ entry) and update every reference to the old location anywhere in the package, including string references. Do not leave a re-export in utils.
touched: [tinydb/utils.py, tinydb/database.py, tinydb/mypy_plugin.py]
absent: ['from \.utils import .*with_typehint', 'tinydb\.utils\.with_typehint']
check: "import tinydb, tinydb.utils as u; from tinydb.typing_utils import with_typehint; assert not hasattr(u, 'with_typehint')"
