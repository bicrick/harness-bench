id: marshmallow-t07-move-orderedset-module
kind: move_module
reference: t07_move_orderedset_module.diff
instruction: >-
  Rename the module src/marshmallow/orderedset.py to src/marshmallow/_ordered_set.py (the file must no longer exist under the old name) and update every import of it across the codebase, including tests. Do not leave a compatibility shim.
touched: [src/marshmallow/orderedset.py, src/marshmallow/schema.py, tests/test_fields.py]
absent: ['marshmallow\.orderedset', 'from \.orderedset']
check: "import os, marshmallow._ordered_set as m; assert hasattr(m, 'OrderedSet'); assert not os.path.exists('src/marshmallow/orderedset.py')"
