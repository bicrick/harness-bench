id: marshmallow-h01-rename-utils-get-value
kind: rename_function_ambiguous
reference: h01_rename_utils_get_value.diff
instruction: >-
  Rename the module-level function `get_value` in src/marshmallow/utils.py to `get_nested_value`. Update every reference to the utils function (imports, `utils.get_value` usages, docstrings, tests). IMPORTANT: the method `Field.get_value` in src/marshmallow/fields.py (and any overrides of it) is a different API and must NOT be renamed. Do not keep the old name in utils.
touched: [src/marshmallow/utils.py, src/marshmallow/fields.py, src/marshmallow/schema.py, tests/test_utils.py]
absent: ['utils\.get_value\b', '^def get_value\(obj', '^\s+get_value,\s*$', 'return get_value\(obj']
check: "import marshmallow.utils as u; from marshmallow.fields import Field; assert hasattr(u, 'get_nested_value') and not hasattr(u, 'get_value'); assert hasattr(Field, 'get_value')"
