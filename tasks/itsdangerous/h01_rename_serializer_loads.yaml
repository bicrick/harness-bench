id: itsdangerous-h01-rename-serializer-loads
kind: rename_method_ambiguous
reference: h01_rename_serializer_loads.diff
instruction: >-
  Rename the public method `Serializer.loads` (src/itsdangerous/serializer.py) to `Serializer.verify_and_load`, including its override `TimedSerializer.loads` in src/itsdangerous/timed.py. Update every call of that method across the codebase, docstrings, and tests. IMPORTANT: the `loads` method of the payload serializer object (the `_PDataSerializer` protocol, `_CompactJSON.loads` in _json.py, and calls such as `use_serializer.loads(...)` / `json.loads`) is a different API and must NOT be renamed. `loads_unsafe` keeps its name. Do not keep the old name on Serializer.
touched: [src/itsdangerous/serializer.py, src/itsdangerous/timed.py, tests/test_itsdangerous/test_serializer.py, tests/test_itsdangerous/test_timed.py]
absent: ['self\.loads\(', '^\s+def loads\(\s*(#.*)?$', '\b(serializer|other|fallback_serializer)\.loads\(']
check: "from itsdangerous import Serializer, URLSafeTimedSerializer; from itsdangerous._json import _CompactJSON; assert hasattr(Serializer, 'verify_and_load') and not hasattr(Serializer, 'loads'); assert not hasattr(URLSafeTimedSerializer, 'loads'); assert hasattr(_CompactJSON, 'loads'); s = Serializer('k'); assert s.verify_and_load(s.dumps({'a': 1})) == {'a': 1}; t = URLSafeTimedSerializer('k'); assert t.verify_and_load(t.dumps([1]), max_age=60) == [1]"
