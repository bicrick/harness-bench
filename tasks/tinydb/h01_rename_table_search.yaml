id: tinydb-h01-rename-table-search
kind: rename_method_ambiguous
reference: h01_rename_table_search.diff
instruction: >-
  Rename the method `Table.search` (tinydb/table.py) to `Table.find_all`. Update every call of the table/database search method across the codebase, including tests and docstring examples (TinyDB forwards unknown attributes to its default table, so `db.search(...)` calls must become `db.find_all(...)`). IMPORTANT: `Query.search` (the regex query method in tinydb/queries.py) is a different method and must NOT be renamed. Do not keep the old name on Table.
touched: [tinydb/table.py, tinydb/__init__.py, tinydb/queries.py, tests/test_tables.py, tests/test_tinydb.py, tests/test_queries.py]
absent: ['\b(db|table|tbl|self)\.search\(', 'def search\(self, cond']
check: "from tinydb.table import Table; from tinydb.queries import Query; assert hasattr(Table, 'find_all') and not hasattr(Table, 'search'); assert hasattr(Query, 'search')"
