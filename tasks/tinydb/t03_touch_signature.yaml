id: tinydb-t03-touch-signature
kind: signature_change
reference: t03_touch_signature.diff
instruction: >-
  In tinydb/storages.py, rename the helper function `touch` to `ensure_file_exists` and make `create_dirs` a keyword-only parameter with default False (signature `ensure_file_exists(path: str, *, create_dirs: bool = False)`). Update every caller, including tests, so all calls pass create_dirs by keyword.
touched: [tinydb/storages.py, tests/test_storages.py]
absent: ['\btouch\(', 'import .*\btouch\b']
check: "import inspect; from tinydb.storages import ensure_file_exists as f; p = inspect.signature(f).parameters['create_dirs']; assert p.kind is p.KEYWORD_ONLY and p.default is False"
