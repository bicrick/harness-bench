id: tinydb-h02-rename-table-insert
kind: rename_method_high_fanout
reference: h02_rename_table_insert.diff
instruction: >-
  Rename the method `Table.insert` (tinydb/table.py) to `Table.insert_document`. Update every call of the table/database insert method across the codebase, including tests and docstring examples (TinyDB forwards unknown attributes to its default table, so `db.insert(...)` calls must become `db.insert_document(...)`). `Table.insert_multiple` is a different method and must keep its name. Do not keep the old name on Table.
touched: [tests/test_middlewares.py, tests/test_queries.py, tests/test_storages.py, tests/test_tables.py, tests/test_tinydb.py, tinydb/__init__.py, tinydb/database.py, tinydb/table.py]
absent: ['\.insert\(', 'def insert\(self']
check: "from tinydb.table import Table; assert hasattr(Table, 'insert_document') and not hasattr(Table, 'insert'); assert hasattr(Table, 'insert_multiple')"
